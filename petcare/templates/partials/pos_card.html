{% from "partials/icons.html" import icon %}
{% macro pos_card(item, kind) -%}
{% set price = item.unit_price if kind == 'product' else item.sale_price %}
<button type="button" class="pos-card" data-pos-item data-selection="{{ kind }}:{{ item.id }}"
        data-name="{{ item.name }}" data-code="{{ item.code }}" data-kind="{{ kind }}" data-price="{{ price }}"
        data-stock="{{ item.stock_qty if kind == 'product' else 1 }}"
        data-photo="{{ url_for('products.photo' if kind == 'product' else 'pets.photo', filename=item.photo_filename) if item.photo_filename else '' }}"
        {% if kind == 'product' and item.stock_qty == 0 %}disabled{% endif %}>
  <span class="pos-card-image">
    {% if item.photo_filename %}<img src="{{ url_for('products.photo' if kind == 'product' else 'pets.photo', filename=item.photo_filename) }}" alt="{{ item.name }}" width="640" height="352" loading="lazy" decoding="async">{% else %}{{ icon('products' if kind == 'product' else 'pets') }}{% endif %}
    <span class="pos-kind">{{ t('Sản phẩm') if kind == 'product' else t('Thú cưng') }}</span>
  </span>
  <span class="pos-card-copy"><small>{{ item.code }}</small><strong>{{ item.name }}</strong><b>{{ format_money(price) }}</b>
    <span class="pos-card-stock">{{ t('còn') }} {{ item.stock_qty if kind == 'product' else 1 }} <span aria-hidden="true">·</span> <span data-pos-action>{{ t('Thêm') if locale == 'vi' else 'Add' }}</span></span>
  </span>
</button>
{%- endmacro %}
