<form class="language-picker" action="{{ url_for('auth.set_language') }}" method="post" data-language-form>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ request.full_path if request.query_string else request.path }}">
  <label class="visually-hidden" for="language-select">{{ t('Language') }}</label>
  <select id="language-select" name="locale" aria-label="{{ t('Language') }}" data-language-select>
    {% for code, label in locale_labels.items() %}<option value="{{ code }}" {% if locale == code %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  <noscript><button class="button button-light button-small" type="submit">{{ t('Áp dụng') }}</button></noscript>
</form>
