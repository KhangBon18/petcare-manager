{% extends "base.html" %}
{% block title %}{{ t('Đặt lại mật khẩu') }}{% endblock %}
{% block content %}
<section class="auth-card panel recovery-card">
  <a class="brand auth-brand" href="{{ url_for('auth.login') }}"><span class="brand-mark">P</span><span><strong>petcare</strong><small>SHOP MANAGER</small></span></a>
  <span class="eyebrow">{{ t('BẢO MẬT TÀI KHOẢN') }}</span><h1>{{ t('Đặt mật khẩu mới') }}</h1>
  <p>{{ t('Liên kết chỉ dùng một lần và hết hạn sau 30 phút.') }}</p>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="token" value="{{ token }}">
    <label>{{ t('Mật khẩu mới') }}<input type="password" name="password" minlength="8" maxlength="1024" autocomplete="new-password" required autofocus></label>
    <label>{{ t('Nhập lại mật khẩu') }}<input type="password" name="confirmation" minlength="8" maxlength="1024" autocomplete="new-password" required></label>
    <button class="button button-primary button-wide" type="submit">{{ t('Cập nhật mật khẩu') }}</button>
  </form>
</section>
{% endblock %}
