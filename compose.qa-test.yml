services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${PETCARE_QA_DATABASE:-petcare_qa_test}
      MYSQL_USER: ${PETCARE_QA_USER:-petcare_qa}
      MYSQL_PASSWORD: ${PETCARE_QA_MYSQL_PASSWORD:?Set PETCARE_QA_MYSQL_PASSWORD to a temporary local test password}
      MYSQL_ROOT_PASSWORD: ${PETCARE_QA_MYSQL_ROOT_PASSWORD:?Set PETCARE_QA_MYSQL_ROOT_PASSWORD to a temporary local test password}
    ports:
      - "127.0.0.1:${PETCARE_QA_MYSQL_PORT:-33307}:3306"
    tmpfs:
      - /var/lib/mysql:rw,nosuid,size=1g
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
